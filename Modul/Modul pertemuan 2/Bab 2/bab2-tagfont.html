<html>
    <head>
        <title>Atribut dari Tag Font</title>
    </head>
    <body>
        <p><font face="Arial">ini font arial yaa</font></p>
        <p><font face="Arial"><i>ini font arial yang miring</i></font></p>
        <p><font face="Verdana" size="4" color="blue">
            <b>ini font verdana berukuran 4, berwarna biru, dan bertulis tebal</b></font></p>
        <p align="center"><font face="Tahoma" color="red">
            <b>ini font tahoma merah, tebal, dan berada di tengah</b></font></p>
        <p align="center"><font face="Arial" color="red">
            ini font arial berwarna merah, </font>
            <font face="Verdana" color="blue">ini font verdana berwarna biru</font></p>
    </body>
</html>
